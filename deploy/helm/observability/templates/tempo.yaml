apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  labels:
    {{- include "obs.componentLabels" (dict "root" . "component" "tempo") | nindent 4 }}
data:
  tempo.yaml: |
{{ .Files.Get "files/tempo/tempo.yaml" | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-data
  labels:
    {{- include "obs.componentLabels" (dict "root" . "component" "tempo") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ .Values.tempo.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  labels:
    {{- include "obs.componentLabels" (dict "root" . "component" "tempo") | nindent 4 }}
spec:
  selector:
    {{- include "obs.selectorLabels" (dict "root" . "component" "tempo") | nindent 4 }}
  ports:
    - name: http
      port: 3200
      targetPort: 3200
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  labels:
    {{- include "obs.componentLabels" (dict "root" . "component" "tempo") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "obs.selectorLabels" (dict "root" . "component" "tempo") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "obs.componentLabels" (dict "root" . "component" "tempo") | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get "files/tempo/tempo.yaml" | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tempo
          image: {{ .Values.images.tempo }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - -config.file=/etc/tempo/tempo.yaml
            - -config.expand-env=true
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "obs.s3.secretName" . }}
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "obs.s3.secretName" . }}
                  key: S3_SECRET_KEY
          ports:
            - { name: http, containerPort: 3200 }
            - { name: otlp-grpc, containerPort: 4317 }
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            {{- toYaml .Values.tempo.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
            - { name: data, mountPath: /var/tempo }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: data
          persistentVolumeClaim:
            claimName: tempo-data
