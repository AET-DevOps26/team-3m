openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost
  description: Generated server url
paths:
  /api/v1/profile:
    get:
      tags:
      - user-profile-controller
      operationId: getProfile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserProfileResponse"
      security:
      - bearerAuth: []
    put:
      tags:
      - user-profile-controller
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRiskToleranceRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          description: Invalid request body
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserProfileResponse"
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserProfileResponse"
      security:
      - bearerAuth: []
  /api/v1/financial-transactions/import:
    post:
      tags:
      - financial-transaction-controller
      operationId: importCsv
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          description: CSV imported successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportApiResponse"
        "400":
          description: "Empty upload, malformed CSV, or row-level validation failure"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
      - bearerAuth: []
  /api/v1/portfolio/performance:
    get:
      tags:
      - portfolio-controller
      operationId: getPerformance
      responses:
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePortfolioPerformance"
      security:
      - bearerAuth: []
  /api/v1/portfolio/overview:
    get:
      tags:
      - portfolio-controller
      operationId: getOverview
      responses:
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePortfolioOverview"
      security:
      - bearerAuth: []
  /api/v1/market-data/search:
    get:
      tags:
      - market-data-controller
      operationId: searchInstruments
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          default: ""
      responses:
        "200":
          description: Instruments matching the query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentSearchApiResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentSearchApiResponse"
        "502":
          description: Market data provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
      - bearerAuth: []
  /api/v1/market-data/quotes/{symbol}:
    get:
      tags:
      - market-data-controller
      operationId: getQuote
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Current quote for the instrument
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentQuoteApiResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentQuoteApiResponse"
        "404":
          description: Unknown symbol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "502":
          description: Market data provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
      - bearerAuth: []
  /api/v1/market-data/quotes/{symbol}/history:
    get:
      tags:
      - market-data-controller
      operationId: getQuoteHistory
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
      - name: range
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1D
          - 1W
          - 1M
          - 1Y
          - MAX
      responses:
        "200":
          description: Historical prices for the instrument
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentHistoryApiResponse"
        "400":
          description: Invalid range parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentHistoryApiResponse"
        "404":
          description: Unknown symbol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "502":
          description: Market data provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
      - bearerAuth: []
  /api/v1/health/server:
    get:
      tags:
      - health-controller
      operationId: server
      responses:
        "200":
          description: Server is up
          content:
            '*/*':
              schema:
                type: string
        "503":
          description: Server is unhealthy
          content:
            '*/*':
              schema:
                type: string
  /api/v1/health/database:
    get:
      tags:
      - health-controller
      operationId: database
      responses:
        "200":
          description: Database connection OK
          content:
            '*/*':
              schema:
                type: string
        "503":
          description: Database connection check failed
          content:
            '*/*':
              schema:
                type: string
  /api/v1/financial-transactions:
    get:
      tags:
      - financial-transaction-controller
      operationId: listTransactions
      parameters:
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 200
      - name: afterDatetime
        in: query
        required: false
        schema:
          type: string
      - name: afterId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: dateFrom
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: dateTo
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: Transaction page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTransactionsApiResponse"
        "400":
          description: Invalid cursor parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
      - bearerAuth: []
  /api/v1/financial-transactions/metadata:
    get:
      tags:
      - financial-transaction-controller
      operationId: getMetadata
      responses:
        "200":
          description: Distinct categories and types for the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionMetadataApiResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionMetadataApiResponse"
      security:
      - bearerAuth: []
components:
  schemas:
    UpdateRiskToleranceRequest:
      type: object
      properties:
        riskTolerance:
          type: string
          enum:
          - CONSERVATIVE
          - MODERATE
          - AGGRESSIVE
      required:
      - riskTolerance
    UserProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type:
          - string
          - "null"
        preferredUsername:
          type:
          - string
          - "null"
        riskTolerance:
          type:
          - string
          - "null"
          enum:
          - CONSERVATIVE
          - MODERATE
          - AGGRESSIVE
      required:
      - id
    ApiResponseUserProfileResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/UserProfileResponse"
        error:
          type:
          - string
          - "null"
        details:
          type:
          - array
          - "null"
          items: {}
      required:
      - success
    CsvImportApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/CsvImportResult"
        error:
          type:
          - string
          - "null"
        details:
          type:
          - array
          - "null"
          items: {}
      required:
      - success
    CsvImportResult:
      type: object
      properties:
        importedCount:
          type: integer
          format: int32
          minimum: 0
        message:
          type: string
      required:
      - importedCount
      - message
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data: {}
        error:
          type:
          - string
          - "null"
        details:
          type:
          - array
          - "null"
          items: {}
      required:
      - success
    ApiResponsePortfolioPerformance:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/PortfolioPerformance"
        error:
          type:
          - string
          - "null"
        details:
          type:
          - array
          - "null"
          items: {}
      required:
      - success
    PortfolioPerformance:
      type: object
      properties:
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioSnapshot"
        currency:
          type: string
    PortfolioSnapshot:
      type: object
      properties:
        datetime:
          type: string
          format: date-time
        value:
          type: number
        cashValue:
          type: number
        investmentValue:
          type: number
    ApiResponsePortfolioOverview:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/PortfolioOverview"
        error:
          type:
          - string
          - "null"
        details:
          type:
          - array
          - "null"
          items: {}
      required:
      - success
    PortfolioHolding:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        assetClass:
          type: string
        currency:
          type: string
        shares:
          type: number
        lastPrice:
          type: number
        currentValue:
          type: number
    PortfolioOverview:
      type: object
      properties:
        holdings:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioHolding"
        cashBalance:
          type: number
        currency:
          type: string
        totalValue:
          type: number
    InstrumentSearchApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/InstrumentSearchResult"
        error:
          type:
          - string
          - "null"
        details:
          type:
          - array
          - "null"
          items: {}
      required:
      - success
    InstrumentSearchResult:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/Match"
    Match:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        exchange:
          type: string
        type:
          type: string
        currency:
          type: string
    InstrumentQuoteApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: "null"
          $ref: "#/components/schemas/InstrumentQuoteResult"
        error:
          type:
          - string
          - "null"
        details:
          type:
          - array
          - "null"
          items: {}
      required:
      - success
    InstrumentQuoteResult:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        currency:
          type: string
        price:
          type: number
        change:
          type: number
        changePercent:
          type: number
    InstrumentHistoryApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/InstrumentHistoryResult"
        error:
          type:
          - string
          - "null"
        details:
          type:
          - array
          - "null"
          items: {}
      required:
      - success
    InstrumentHistoryResult:
      type: object
      properties:
        symbol:
          type: string
        currency:
          type: string
        range:
          type: string
        series:
          type: array
          items:
            $ref: "#/components/schemas/PricePoint"
    PricePoint:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        close:
          type: number
    FinancialTransactionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        datetime:
          type: string
          format: date-time
        date:
          type: string
          format: date
        accountType:
          type: string
        category:
          type: string
        type:
          type: string
        assetClass:
          type:
          - string
          - "null"
        name:
          type:
          - string
          - "null"
        symbol:
          type:
          - string
          - "null"
        shares:
          type:
          - number
          - "null"
        price:
          type:
          - number
          - "null"
        amount:
          type: number
        fee:
          type:
          - number
          - "null"
        tax:
          type:
          - number
          - "null"
        currency:
          type: string
        originalAmount:
          type:
          - number
          - "null"
        originalCurrency:
          type:
          - string
          - "null"
        fxRate:
          type:
          - number
          - "null"
        description:
          type:
          - string
          - "null"
        externalTransactionId:
          type:
          - string
          - "null"
          format: uuid
        counterpartyName:
          type:
          - string
          - "null"
        counterpartyIban:
          type:
          - string
          - "null"
        paymentReference:
          type:
          - string
          - "null"
        mccCode:
          type:
          - string
          - "null"
      required:
      - accountType
      - amount
      - category
      - currency
      - date
      - datetime
      - id
      - type
    ListTransactionsApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/TransactionPage"
        error:
          type:
          - string
          - "null"
        details:
          type:
          - array
          - "null"
          items: {}
      required:
      - success
    TransactionCursor:
      type: object
      properties:
        afterDatetime:
          type: string
          format: date-time
        afterId:
          type: string
          format: uuid
      required:
      - afterDatetime
      - afterId
    TransactionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FinancialTransactionResponse"
        nextCursor:
          $ref: "#/components/schemas/TransactionCursor"
          anyOf:
          - $ref: "#/components/schemas/TransactionCursor"
          - {}
      required:
      - items
    TransactionMetadata:
      type: object
      properties:
        categories:
          type: array
          items:
            type: string
        types:
          type: array
          items:
            type: string
    TransactionMetadataApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/TransactionMetadata"
        error:
          type:
          - string
          - "null"
        details:
          type:
          - array
          - "null"
          items: {}
      required:
      - success
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
