{{- if .Values.networkPolicy.enabled }}
---
# Core Postgres: only accept traffic from the core deployment in this release.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kontor.postgres.fullname" . }}
  labels:
    {{- include "kontor.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      {{- include "kontor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "kontor.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: core
      ports:
        - protocol: TCP
          port: 5432
---
# Core: ingress from the ingress-nginx namespace + the client pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kontor.core.fullname" . }}
  labels:
    {{- include "kontor.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
spec:
  podSelector:
    matchLabels:
      {{- include "kontor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.restrictEgress }}
    - Egress
    {{- end }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              {{- include "kontor.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: client
      ports:
        - protocol: TCP
          port: 8080
  {{- if .Values.networkPolicy.restrictEgress }}
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Core Postgres in this release
    - to:
        - podSelector:
            matchLabels:
              {{- include "kontor.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    {{- if .Values.keycloak.deploy }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "kontor.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: keycloak
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- if .Values.observability.enabled }}
    # OTLP export to the Alloy gateway in the shared monitoring namespace.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.observability.collectorNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: alloy-gateway
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    {{- end }}
    # Public APIs used by the core service, excluding non-public and reserved
    # IPv4 destinations. IPv6 stays denied because no IPv6 ipBlock is allowed.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 443
  {{- end }}
---
# RabbitMQ (subchart pods): AMQP (5672) only from the news aggregator; the
# future news processor gets added here when it exists. The management UI
# (15672) stays cluster-internal (kubectl port-forward).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kontor.rabbitmq.fullname" . }}
  labels:
    {{- include "kontor.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "kontor.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: news
      ports:
        - protocol: TCP
          port: 5672
---
# News: ingress from ingress-nginx only, for the public API-docs paths routed
# through the ingress (in-cluster consumers get added here when they exist).
# Egress stays open unless restrictEgress is set; then, in addition to
# DNS/Postgres/Keycloak/RabbitMQ/OTLP, allow HTTPS to non-cluster addresses
# because the aggregator fetches public RSS feeds and article pages.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kontor.news.fullname" . }}
  labels:
    {{- include "kontor.labels" . | nindent 4 }}
    app.kubernetes.io/component: news
spec:
  podSelector:
    matchLabels:
      {{- include "kontor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: news
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.restrictEgress }}
    - Egress
    {{- end }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  {{- if .Values.networkPolicy.restrictEgress }}
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Dedicated news Postgres in this release
    - to:
        - podSelector:
            matchLabels:
              {{- include "kontor.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: news-db
      ports:
        - protocol: TCP
          port: 5432
    # RabbitMQ in this release
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 5672
    {{- if .Values.keycloak.deploy }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "kontor.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: keycloak
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- if .Values.observability.enabled }}
    # OTLP export to the Alloy gateway in the shared monitoring namespace.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.observability.collectorNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: alloy-gateway
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    {{- end }}
    # Public RSS feeds / article pages over HTTPS (cluster-internal and
    # private ranges excluded — in-cluster traffic is covered above).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 443
  {{- end }}
---
# News DB: only accept traffic from the news deployment in this release.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kontor.news.postgres.fullname" . }}
  labels:
    {{- include "kontor.labels" . | nindent 4 }}
    app.kubernetes.io/component: news-db
spec:
  podSelector:
    matchLabels:
      {{- include "kontor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: news-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "kontor.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: news
      ports:
        - protocol: TCP
          port: 5432
---
# Client: ingress from ingress-nginx only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kontor.client.fullname" . }}
  labels:
    {{- include "kontor.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  podSelector:
    matchLabels:
      {{- include "kontor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: client
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
# AI service: ingress from ingress-nginx only, so in-cluster pods cannot bypass
# the /ai ingress rate limits on the paid LLM endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kontor.ai.fullname" . }}
  labels:
    {{- include "kontor.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai
spec:
  podSelector:
    matchLabels:
      {{- include "kontor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ai
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
---
# AI DB: only accept traffic from the AI service (migrations run as an AI init container).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kontor.ai.postgres.fullname" . }}
  labels:
    {{- include "kontor.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-db
spec:
  podSelector:
    matchLabels:
      {{- include "kontor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ai-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "kontor.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: ai
      ports:
        - protocol: TCP
          port: 5432
{{- if .Values.keycloak.deploy }}
{{- if eq .Values.keycloak.database "postgres" }}
---
# Keycloak DB: only accept traffic from the Keycloak deployment in this release.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kontor.keycloak.postgres.fullname" . }}
  labels:
    {{- include "kontor.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-db
spec:
  podSelector:
    matchLabels:
      {{- include "kontor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: keycloak-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "kontor.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: keycloak
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
---
# Keycloak: HTTP (8080) ingress from ingress-nginx and the core pod. The management
# port (9000, health/metrics) stays cluster-internal except — when observability is
# enabled — for the Alloy collector in the monitoring namespace, which scrapes its
# Prometheus metrics. Kubelet probes bypass NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kontor.keycloak.fullname" . }}
  labels:
    {{- include "kontor.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  podSelector:
    matchLabels:
      {{- include "kontor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              {{- include "kontor.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: core
        - podSelector:
            matchLabels:
              {{- include "kontor.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: ai
        - podSelector:
            matchLabels:
              {{- include "kontor.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: news
      ports:
        - protocol: TCP
          port: 8080
    {{- if .Values.observability.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.observability.collectorNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: alloy-gateway
      ports:
        - protocol: TCP
          port: 9000
    {{- end }}
{{- end }}
{{- end }}
