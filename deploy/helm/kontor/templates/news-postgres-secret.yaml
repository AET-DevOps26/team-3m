{{- if not .Values.news.db.existingSecret }}
{{- if not .Values.news.db.password -}}
{{- fail "news.db.password is required when news.db.existingSecret is not set. Supply via -f secrets.yaml (see secrets.example.yaml) or --set news.db.password=..." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kontor.news.postgres.secretName" . }}
  labels:
    {{- include "kontor.labels" . | nindent 4 }}
    app.kubernetes.io/component: news-db
type: Opaque
stringData:
  NEWS_POSTGRES_DB: {{ .Values.news.db.database | quote }}
  NEWS_POSTGRES_USER: {{ .Values.news.db.username | quote }}
  NEWS_POSTGRES_PASSWORD: {{ .Values.news.db.password | quote }}
{{- end }}
