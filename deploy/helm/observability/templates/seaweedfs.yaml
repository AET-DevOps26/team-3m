apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-config
  labels:
    {{- include "obs.componentLabels" (dict "root" . "component" "seaweedfs") | nindent 4 }}
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "observability",
          "credentials": [
            {
              "accessKey": {{ .Values.s3.accessKey | quote }},
              "secretKey": {{ .Values.s3.secretKey | quote }}
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  labels:
    {{- include "obs.componentLabels" (dict "root" . "component" "seaweedfs") | nindent 4 }}
spec:
  selector:
    {{- include "obs.selectorLabels" (dict "root" . "component" "seaweedfs") | nindent 4 }}
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
    - name: master
      port: 9333
      targetPort: 9333
    - name: filer
      port: 8888
      targetPort: 8888
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  labels:
    {{- include "obs.componentLabels" (dict "root" . "component" "seaweedfs") | nindent 4 }}
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      {{- include "obs.selectorLabels" (dict "root" . "component" "seaweedfs") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "obs.componentLabels" (dict "root" . "component" "seaweedfs") | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s:%s" .Values.s3.accessKey .Values.s3.secretKey | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: {{ .Values.images.seaweedfs }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - server
            - -dir=/data
            - -ip.bind=0.0.0.0
            - -s3
            - -s3.config=/etc/seaweedfs/s3.json
            - -master.volumeSizeLimitMB=1024
            - -master.volumePreallocate=false
          ports:
            - { name: s3, containerPort: 8333 }
            - { name: master, containerPort: 9333 }
            - { name: filer, containerPort: 8888 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /etc/seaweedfs }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet:
              path: /cluster/healthz
              port: master
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /cluster/healthz
              port: master
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.seaweedfs.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: seaweedfs-config
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests:
            storage: {{ .Values.seaweedfs.persistence.size }}
