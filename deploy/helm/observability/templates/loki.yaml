apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  labels:
    {{- include "obs.componentLabels" (dict "root" . "component" "loki") | nindent 4 }}
data:
  loki.yaml: |
{{ .Files.Get "files/loki/loki.yaml" | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  labels:
    {{- include "obs.componentLabels" (dict "root" . "component" "loki") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ .Values.loki.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    {{- include "obs.componentLabels" (dict "root" . "component" "loki") | nindent 4 }}
spec:
  selector:
    {{- include "obs.selectorLabels" (dict "root" . "component" "loki") | nindent 4 }}
  ports:
    - name: http
      port: 3100
      targetPort: 3100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    {{- include "obs.componentLabels" (dict "root" . "component" "loki") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "obs.selectorLabels" (dict "root" . "component" "loki") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "obs.componentLabels" (dict "root" . "component" "loki") | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get "files/loki/loki.yaml" | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          image: {{ .Values.images.loki }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - -config.file=/etc/loki/loki.yaml
            - -config.expand-env=true
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "obs.s3.secretName" . }}
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "obs.s3.secretName" . }}
                  key: S3_SECRET_KEY
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
