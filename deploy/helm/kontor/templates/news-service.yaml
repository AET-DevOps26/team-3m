apiVersion: v1
kind: Service
metadata:
  name: {{ include "kontor.news.fullname" . }}
  labels:
    {{- include "kontor.labels" . | nindent 4 }}
    app.kubernetes.io/component: news
spec:
  type: {{ .Values.news.service.type }}
  ports:
    - name: http
      port: {{ .Values.news.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kontor.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: news
