{{- if .Values.keycloak.deploy }}
{{- $realm := .Values.oidc.realm }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kontor.keycloak.fullname" . }}-realm
  labels:
    {{- include "kontor.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
data:
  {{ $realm }}-realm.json: |-
    {
      "realm": {{ $realm | quote }},
      "enabled": true,
      {{- with .Values.keycloak.realm.loginTheme }}
      "loginTheme": {{ . | quote }},
      {{- end }}
      "sslRequired": {{ .Values.keycloak.realm.sslRequired | quote }},
      "registrationAllowed": {{ .Values.keycloak.realm.registrationAllowed }},
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": false,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "accessTokenLifespan": 300,
      "ssoSessionIdleTimeout": 1800,
      "ssoSessionMaxLifespan": 36000,
      "roles": {
        "realm": [
          {
            "name": "kontor-user",
            "description": "Standard user able to manage their own financial data."
          },
          {
            "name": "kontor-admin",
            "description": "Grants the Grafana Admin role via SSO."
          }
        ]
      },
      {{- if .Values.keycloak.realm.seedDevUser }}
      "users": [
        {
          "id": "00000000-0000-0000-0000-000000000001",
          "username": "dev",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Dev",
          "lastName": "User",
          "email": "dev@kontor.local",
          "credentials": [
            { "type": "password", "value": "dev", "temporary": false }
          ],
          "realmRoles": ["kontor-user", {{ printf "default-roles-%s" $realm | quote }}]
        }
      ],
      {{- end }}
      "clients": [
        {
          "clientId": {{ .Values.oidc.clientId | quote }},
          "name": "Kontor SPA (browser client)",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "frontchannelLogout": true,
          "protocol": "openid-connect",
          "redirectUris": {{ .Values.keycloak.realm.redirectUris | toJson }},
          "webOrigins": {{ .Values.keycloak.realm.webOrigins | toJson }},
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "+"
          },
          "defaultClientScopes": [
            "web-origins",
            "acr",
            "profile",
            "roles",
            "basic",
            "email"
          ],
          "optionalClientScopes": [
            "address",
            "phone",
            "offline_access",
            "microprofile-jwt"
          ],
          "protocolMappers": [
            {
              "name": "kontor-api-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.custom.audience": {{ .Values.oidc.audience | quote }},
                "id.token.claim": "false",
                "access.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ]
        }
        {{- if .Values.keycloak.realm.grafanaClient.enabled }}
        ,{
          "clientId": "grafana",
          "name": "Grafana (observability SSO)",
          "enabled": true,
          "publicClient": false,
          "secret": {{ .Values.keycloak.realm.grafanaClient.secret | quote }},
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "protocol": "openid-connect",
          {{- with .Values.keycloak.realm.grafanaClient.rootUrl }}
          "rootUrl": {{ . | quote }},
          {{- end }}
          "redirectUris": {{ .Values.keycloak.realm.grafanaClient.redirectUris | toJson }},
          "webOrigins": ["+"],
          "defaultClientScopes": ["web-origins", "acr", "profile", "roles", "basic", "email"]
        }
        {{- end }}
      ]
    }
{{- end }}
