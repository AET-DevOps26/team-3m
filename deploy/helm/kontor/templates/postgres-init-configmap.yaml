{{- if .Values.postgres.enabled }}
# Idempotent database-role reconciliation script used by the provisioning Job.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kontor.postgres.fullname" . }}-init
  labels:
    {{- include "kontor.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
data:
  init-news-db.sh: |
{{ .Files.Get "files/postgres/init-news-db.sh" | indent 4 }}
{{- end }}
