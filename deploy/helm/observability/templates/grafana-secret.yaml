{{- if not .Values.grafana.existingSecret }}
{{- if not .Values.grafana.adminPassword -}}
{{- fail "grafana.adminPassword is required when grafana.existingSecret is not set. Supply via --set-string grafana.adminPassword=... (the workflow wires it from the GRAFANA_ADMIN_PASSWORD secret)." -}}
{{- end -}}
{{- if and .Values.grafana.oauth.enabled (not .Values.grafana.oauth.clientSecret) -}}
{{- fail "grafana.oauth.clientSecret is required when grafana.oauth.enabled is true and grafana.existingSecret is not set." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "obs.grafana.secretName" . }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-user: {{ .Values.grafana.adminUser | quote }}
  admin-password: {{ .Values.grafana.adminPassword | quote }}
  oauth-client-secret: {{ .Values.grafana.oauth.clientSecret | quote }}
{{- end }}
