[project]
name = "kontor-ai"
version = "0.27.2"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.49",
    "pydantic>=2.13",
    "openai>=2.41.1",
    "pydantic-settings>=2.14.1",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "opentelemetry-distro>=0.50b0",
    "opentelemetry-exporter-otlp>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-logging>=0.50b0",
]

[project.scripts]
export-openapi = "advisor.openapi:main"

[dependency-groups]
ci = [
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "ruff>=0.15",
    "ty>=0.0.46",
]
dev = [
    {include-group = "ci"},
]

[build-system]
requires = ["uv_build>=0.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "advisor"
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
