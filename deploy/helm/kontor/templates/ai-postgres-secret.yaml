{{- if not .Values.ai.db.existingSecret }}
{{- if not .Values.ai.db.password -}}
{{- fail "ai.db.password is required when ai.db.existingSecret is not set. Supply via -f secrets.yaml (see secrets.example.yaml) or --set ai.db.password=..." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kontor.ai.postgres.secretName" . }}
  labels:
    {{- include "kontor.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-db
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.ai.db.database | quote }}
  POSTGRES_USER: {{ .Values.ai.db.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.ai.db.password | quote }}
  {{- /* urlquery is Go's QueryEscape: it encodes a space as "+", which URL userinfo
       parsing keeps literal. Re-encode to %20 so the password survives the roundtrip. */}}
  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s:5432/%s" (.Values.ai.db.username | urlquery | replace "+" "%20") (.Values.ai.db.password | urlquery | replace "+" "%20") (include "kontor.ai.postgres.fullname" .) .Values.ai.db.database | quote }}
{{- end }}
