{{- if and (not .Values.ai.existingSecret) .Values.ai.logosApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kontor.ai.secretName" . }}
  labels:
    {{- include "kontor.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai
type: Opaque
stringData:
  LOGOS_API_KEY: {{ .Values.ai.logosApiKey | quote }}
{{- end }}
