{{- if .Values.alloy.gateway.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alloy-otlp
  labels:
    {{- include "obs.componentLabels" (dict "root" . "component" "alloy-gateway") | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    {{- if .Values.alloy.gateway.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.alloy.gateway.ingress.tls.clusterIssuer }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.alloy.gateway.ingress.className }}
  {{- if .Values.alloy.gateway.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.alloy.gateway.ingress.host }}
      secretName: {{ .Values.alloy.gateway.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.alloy.gateway.ingress.host }}
      http:
        paths:
          - path: /collect
            pathType: Prefix
            backend:
              service:
                name: alloy
                port:
                  number: 12347
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alloy
                port:
                  number: 4318
{{- end }}
