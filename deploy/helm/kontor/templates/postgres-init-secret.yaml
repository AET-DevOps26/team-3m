{{- if .Values.postgres.enabled }}
# The script contains no credential values, but it references credential
# environment variables. Store it as a Secret so policy scanners do not treat
# those references as secrets exposed through a ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kontor.postgres.fullname" . }}-init
  labels:
    {{- include "kontor.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  init-news-db.sh: |
{{ .Files.Get "files/postgres/init-news-db.sh" | indent 4 }}
{{- end }}
