{{- if include "obs.alerting.enabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  labels:
    {{- include "obs.componentLabels" (dict "root" . "component" "grafana") | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "files/grafana/alerting/*.yaml" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
