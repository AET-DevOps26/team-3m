x-keycloak-oidc-env: &keycloak-oidc-env
  KEYCLOAK_ISSUER: "http://localhost:${KEYCLOAK_PORT:-8081}/realms/kontor"
  KEYCLOAK_JWK_SET_URI: "http://keycloak:8080/realms/kontor/protocol/openid-connect/certs"
  KEYCLOAK_AUDIENCE: "${KEYCLOAK_AUDIENCE:-kontor-api}"

services:
  db:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-team3m}"
      POSTGRES_USER: "${POSTGRES_USER:-team3m}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me-local}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  news-db:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: "${NEWS_POSTGRES_DB:-news}"
      POSTGRES_USER: "${NEWS_POSTGRES_USER:-news}"
      POSTGRES_PASSWORD: "${NEWS_POSTGRES_PASSWORD:-change-me-news-local}"
    ports:
      - "127.0.0.1:${NEWS_POSTGRES_PORT:-5434}:5432"
    volumes:
      - news_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  keycloak-db:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: "${KEYCLOAK_POSTGRES_DB:-keycloak}"
      POSTGRES_USER: "${KEYCLOAK_POSTGRES_USER:-keycloak}"
      POSTGRES_PASSWORD: "${KEYCLOAK_POSTGRES_PASSWORD:-change-me-local}"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  ai-db:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: "${AI_POSTGRES_DB:-kontor_ai}"
      POSTGRES_USER: "${AI_POSTGRES_USER:-kontor_ai}"
      POSTGRES_PASSWORD: "${AI_POSTGRES_PASSWORD:-change-me-local}"
    ports:
      - "${AI_POSTGRES_PORT:-5433}:5432"
    volumes:
      - ai_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  keycloak:
    # Built from the vendored Keycloakify theme so the Kontor login theme is
    # baked in (no stock image + sibling-repo jar). First `up` builds the image,
    # then it is cached. `start-dev` runs the provider build and loads the theme.
    build:
      context: ./infra/keycloak/theme
    image: kontor-keycloak:dev
    command: ["start-dev", "--import-realm"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USER:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: "${KEYCLOAK_POSTGRES_DB:-keycloak}"
      KC_DB_USERNAME: "${KEYCLOAK_POSTGRES_USER:-keycloak}"
      KC_DB_PASSWORD: "${KEYCLOAK_POSTGRES_PASSWORD:-change-me-local}"
      KC_HOSTNAME: "${KEYCLOAK_HOSTNAME:-localhost}"
      KC_HOSTNAME_PORT: "${KEYCLOAK_PORT:-8081}"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_DEV_USERS_PASSWORD: "${KEYCLOAK_DEV_USERS_PASSWORD:-dev}"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
      - "${KEYCLOAK_MGMT_PORT:-9000}:9000"
    volumes:
      - ./infra/keycloak/realms:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  core:
    build:
      context: ./core
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      <<: *keycloak-oidc-env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-team3m}"
      POSTGRES_USER: "${POSTGRES_USER:-team3m}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me-local}"
      SPRING_PROFILES_ACTIVE: seed
      TWELVE_DATA_API_KEY: "${TWELVE_DATA_API_KEY:-}"
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/api/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-news}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-change-me-rabbit-local}"
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  news:
    build:
      context: ./news
    depends_on:
      news-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *keycloak-oidc-env
      NEWS_POSTGRES_HOST: news-db
      NEWS_POSTGRES_PORT: "5432"
      NEWS_POSTGRES_DB: "${NEWS_POSTGRES_DB:-news}"
      NEWS_POSTGRES_USER: "${NEWS_POSTGRES_USER:-news}"
      NEWS_POSTGRES_PASSWORD: "${NEWS_POSTGRES_PASSWORD:-change-me-news-local}"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "${RABBITMQ_USER:-news}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-change-me-rabbit-local}"
    ports:
      - "8082:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/api/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  client:
    build:
      context: ./client
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "5173:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  ai-migrate:
    image: kontor-ai:local
    build:
      context: ./ai
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      ai-db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://${AI_POSTGRES_USER:-kontor_ai}:${AI_POSTGRES_PASSWORD:-change-me-local}@ai-db:5432/${AI_POSTGRES_DB:-kontor_ai}"

  ai:
    image: kontor-ai:local
    build:
      context: ./ai
    # Without LOGOS_API_KEY the service falls back to a local OpenAI-compatible LLM. This
    # default targets a *native* host Ollama (fast, uses the Mac GPU); host.docker.internal
    # is resolved on Linux via the host-gateway alias below. The compose-managed Ollama is
    # opt-in through docker-compose.local-llm.yml, which overrides LOCAL_LLM_BASE_URL.
    depends_on:
      ai-migrate:
        condition: service_completed_successfully
      news:
        condition: service_started
    environment:
      <<: *keycloak-oidc-env
      DATABASE_URL: "postgresql+asyncpg://${AI_POSTGRES_USER:-kontor_ai}:${AI_POSTGRES_PASSWORD:-change-me-local}@ai-db:5432/${AI_POSTGRES_DB:-kontor_ai}"
      LOGOS_API_KEY: "${LOGOS_API_KEY:-}"
      LOGOS_EMBEDDING_MODEL: "${LOGOS_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-8B}"
      LOCAL_LLM_BASE_URL: "${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}"
      LOCAL_LLM_MODEL: "${LOCAL_LLM_MODEL:-llama3.2}"
      LOCAL_EMBEDDING_MODEL: "${LOCAL_EMBEDDING_MODEL:-nomic-embed-text}"
      # An explicit URL remains available for TLS/vhost deployments. Otherwise the
      # consumer uses the discrete credentials shared with the local news producer.
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "${RABBITMQ_USER:-news}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-change-me-rabbit-local}"
      NEWS_QUEUE: "${NEWS_QUEUE:-news.articles}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8000/ai/health/readiness >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  news_postgres_data:
  keycloak_postgres_data:
  rabbitmq_data:
  ai_postgres_data:
