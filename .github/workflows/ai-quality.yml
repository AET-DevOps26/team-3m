name: AI Quality

on:
  workflow_call:
  workflow_dispatch:

jobs:
  quality:
    name: Lint & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ai
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_DB: kontor_ai
          POSTGRES_USER: kontor_ai
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kontor_ai -d kontor_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --group ci

      - name: Check Formatting (ruff)
        run: uv run ruff format --check .

      - name: Run Linter (ruff)
        run: uv run ruff check .

      - name: Type Check (ty)
        run: uv run ty check

      - name: Run Tests (pytest)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://kontor_ai:ci@localhost:5432/kontor_ai
        run: uv run pytest

      - name: Migration smoke test (Postgres)
        env:
          DATABASE_URL: postgresql+asyncpg://kontor_ai:ci@localhost:5432/kontor_ai
        run: |
          uv run alembic upgrade head
          uv run python - <<'PY'
          import asyncio

          from advisor.db import session_factory
          from advisor.repository import get_latest_recommendation, save_recommendation


          async def main() -> None:
              async with session_factory() as session:
                  await save_recommendation(
                      session, user_id="ci", recommendation="r", rationale="why", risk_tolerance=None
                  )
              async with session_factory() as session:
                  latest = await get_latest_recommendation(session, "ci")
              assert latest is not None and latest.recommendation == "r"
              print("round-trip OK")


          asyncio.run(main())
          PY
