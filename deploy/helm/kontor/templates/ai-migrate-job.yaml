apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kontor.ai.fullname" . }}-migrate
  labels:
    {{- include "kontor.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-migrate
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "kontor.labels" . | nindent 8 }}
        app.kubernetes.io/component: ai-migrate
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.ai.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "kontor.image" (dict "root" . "component" .Values.ai) | quote }}
          imagePullPolicy: {{ include "kontor.imagePullPolicy" (dict "root" . "component" .Values.ai) }}
          securityContext:
            {{- toYaml .Values.ai.containerSecurityContext | nindent 12 }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: {{ include "kontor.ai.postgres.secretName" . }}
          resources:
            {{- toYaml .Values.ai.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.ai.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ai.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ai.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
