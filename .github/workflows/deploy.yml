name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "GH Environment + values overlay (k8s-prod | k8s-preview)"
        required: true
        type: string
      release-name:
        description: "Helm release name"
        required: true
        type: string
      namespace:
        description: "Target namespace (created in the Rancher project if missing)"
        required: true
        type: string
      image-tag:
        description: "Tag pinned (semver for prod, sha-<short> for preview)"
        required: false
        type: string
        default: ""
      pr-number:
        description: "PR number, used to template preview hostnames"
        required: false
        type: string
        default: ""
      base-domain:
        description: "Base domain for preview hostnames (pr-<N>.<base-domain>)"
        required: false
        type: string
        default: "team-3m.stud.k8s.aet.cit.tum.de"
      action:
        description: "deploy | teardown"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.namespace }}
  cancel-in-progress: false

env:
  CHART: deploy/helm/kontor
  NS_TEMPLATE: deploy/rbac/namespace.tpl

jobs:
  deploy:
    name: ${{ inputs.action }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 8

    steps:
      - name: Checkout (deploy/ only)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: deploy

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3

      - name: Configure kubeconfig
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl auth whoami

      - name: Ensure namespace (in Rancher project)
        if: inputs.action == 'deploy'
        env:
          NAMESPACE: ${{ inputs.namespace }}
          RANCHER_PROJECT_ID: ${{ vars.RANCHER_PROJECT_ID }}
        run: |
          set -euo pipefail
          export RANCHER_PROJECT_LABEL="${RANCHER_PROJECT_ID#*:}"
          envsubst < "$NS_TEMPLATE" | kubectl apply -f -

      - name: Recover stuck release
        if: inputs.action == 'deploy'
        env:
          RELEASE: ${{ inputs.release-name }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          status="$(helm status "$RELEASE" -n "$NAMESPACE" -o json 2>/dev/null \
            | jq -r '.info.status' || true)"
          echo "Current release status: ${status:-<none>}"
          case "$status" in
            pending-install)
              echo "Stuck in pending-install (first install never completed); uninstalling."
              helm uninstall "$RELEASE" -n "$NAMESPACE" --wait --timeout 2m || true
              ;;
            pending-upgrade|pending-rollback)
              echo "Stuck in $status; rolling back to last deployed revision."
              helm rollback "$RELEASE" -n "$NAMESPACE" --wait --timeout 3m \
                || { echo "Rollback failed; uninstalling."; helm uninstall "$RELEASE" -n "$NAMESPACE" --wait --timeout 2m || true; }
              ;;
            *)
              echo "No recovery needed."
              ;;
          esac

      - name: Build chart dependencies
        if: inputs.action == 'deploy'
        run: helm dependency build "$CHART"

      - name: Prepare AI ingress migration
        if: inputs.action == 'deploy'
        env:
          RELEASE: ${{ inputs.release-name }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          if ! kubectl get ingress "$RELEASE" -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "Main ingress does not exist yet; no migration needed."
            exit 0
          fi
          if ! kubectl get ingress "$RELEASE" -n "$NAMESPACE" -o json \
            | jq -e 'any(.spec.rules[]?.http.paths[]?; .path == "/ai")' >/dev/null; then
            echo "Main ingress no longer owns /ai; no migration needed."
            exit 0
          fi
          echo "Removing /ai from main ingress before Helm creates the dedicated AI ingress."
          kubectl get ingress "$RELEASE" -n "$NAMESPACE" -o json \
            | jq 'del(.metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"]) | .spec.rules |= map(if .http.paths then .http.paths |= map(select(.path != "/ai")) else . end)' \
            | kubectl replace -f -

      - name: Helm deploy (prod)
        if: inputs.action == 'deploy' && inputs.environment == 'k8s-prod'
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          NEWS_POSTGRES_PASSWORD: ${{ secrets.NEWS_POSTGRES_PASSWORD }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
          LOGOS_API_KEY: ${{ secrets.LOGOS_API_KEY }}
          LOGOS_EMBEDDING_MODEL: ${{ vars.LOGOS_EMBEDDING_MODEL || 'Qwen/Qwen3-Embedding-8B' }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          AI_DB_PASSWORD: ${{ secrets.AI_DB_PASSWORD }}
          GRAFANA_OAUTH_CLIENT_SECRET: ${{ secrets.GRAFANA_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          AI_DB_PASSWORD="${AI_DB_PASSWORD:-$POSTGRES_PASSWORD}"
          EXTRA=()
          # Grafana SSO client secret (shared with the observability stack); only set
          # when configured, so the realm's grafana client matches Grafana's generic_oauth.
          [ -n "${GRAFANA_OAUTH_CLIENT_SECRET}" ] && EXTRA+=(--set-string "keycloak.realm.grafanaClient.secret=${GRAFANA_OAUTH_CLIENT_SECRET}")
          helm upgrade --install '${{ inputs.release-name }}' "$CHART" \
            -n '${{ inputs.namespace }}' \
            -f "$CHART/values-prod.yaml" \
            --set-string core.image.tag='${{ inputs.image-tag }}' \
            --set-string client.image.tag='${{ inputs.image-tag }}' \
            --set-string news.image.tag='${{ inputs.image-tag }}' \
            --set-string ai.image.tag='${{ inputs.image-tag }}' \
            --set-string keycloak.image.tag='${{ inputs.image-tag }}' \
            --set-string postgres.password="$POSTGRES_PASSWORD" \
            --set-string news.db.password="$NEWS_POSTGRES_PASSWORD" \
            --set-string keycloak.admin.password="$KEYCLOAK_ADMIN_PASSWORD" \
            --set-string keycloak.db.password="$KEYCLOAK_DB_PASSWORD" \
            --set-string ai.logosApiKey="$LOGOS_API_KEY" \
            --set-string ai.embedding.logosModel="$LOGOS_EMBEDDING_MODEL" \
            --set-string core.twelveDataApiKey="$TWELVE_DATA_API_KEY" \
            --set-string ai.db.password="$AI_DB_PASSWORD" \
            "${EXTRA[@]}" \
            --rollback-on-failure --force-conflicts --wait --wait-for-jobs --timeout 4m

      - name: Helm deploy (preview)
        if: inputs.action == 'deploy' && inputs.environment == 'k8s-preview'
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          NEWS_POSTGRES_PASSWORD: ${{ secrets.NEWS_POSTGRES_PASSWORD }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          LOGOS_API_KEY: ${{ secrets.LOGOS_API_KEY }}
          LOGOS_EMBEDDING_MODEL: ${{ vars.LOGOS_EMBEDDING_MODEL || 'Qwen/Qwen3-Embedding-8B' }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          AI_DB_PASSWORD: ${{ secrets.AI_DB_PASSWORD }}
          PR_NUMBER: ${{ inputs.pr-number }}
          BASE_DOMAIN: ${{ inputs.base-domain }}
        run: |
          set -euo pipefail
          AI_DB_PASSWORD="${AI_DB_PASSWORD:-$POSTGRES_PASSWORD}"
          # envsubst expects literal variable names in its first argument.
          # shellcheck disable=SC2016
          envsubst '${PR_NUMBER} ${BASE_DOMAIN}' \
            < "$CHART/values-pr.template.yaml" > /tmp/values-pr.yaml
          helm upgrade --install '${{ inputs.release-name }}' "$CHART" \
            -n '${{ inputs.namespace }}' \
            -f /tmp/values-pr.yaml \
            --set-string core.image.tag='${{ inputs.image-tag }}' \
            --set-string client.image.tag='${{ inputs.image-tag }}' \
            --set-string news.image.tag='${{ inputs.image-tag }}' \
            --set-string ai.image.tag='${{ inputs.image-tag }}' \
            --set-string keycloak.image.tag='${{ inputs.image-tag }}' \
            --set-string postgres.password="$POSTGRES_PASSWORD" \
            --set-string news.db.password="$NEWS_POSTGRES_PASSWORD" \
            --set-string keycloak.admin.password="$KEYCLOAK_ADMIN_PASSWORD" \
            --set-string ai.logosApiKey="$LOGOS_API_KEY" \
            --set-string ai.embedding.logosModel="$LOGOS_EMBEDDING_MODEL" \
            --set-string core.twelveDataApiKey="$TWELVE_DATA_API_KEY" \
            --set-string ai.db.password="$AI_DB_PASSWORD" \
            --rollback-on-failure --force-conflicts --wait --wait-for-jobs --timeout 4m

      - name: Diagnose failed deploy
        if: failure() && inputs.action == 'deploy'
        env:
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -uo pipefail
          # rollback-on-failure already deleted the release's pods by the time this
          # runs, so lean on PVCs (survive StatefulSet deletion) and Events (outlive
          # the objects they describe) rather than pod-scoped commands.
          echo "::group::Pods"
          kubectl get pods -n "$NAMESPACE" -o wide || true
          echo "::endgroup::"
          echo "::group::PVCs"
          kubectl get pvc -n "$NAMESPACE" || true
          echo "::endgroup::"
          echo "::group::Recent events"
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp | tail -100 || true
          echo "::endgroup::"

      - name: Helm teardown
        if: inputs.action == 'teardown'
        run: |
          set -euo pipefail
          helm uninstall '${{ inputs.release-name }}' -n '${{ inputs.namespace }}' --wait || true
          kubectl delete namespace '${{ inputs.namespace }}' --ignore-not-found --wait=false
