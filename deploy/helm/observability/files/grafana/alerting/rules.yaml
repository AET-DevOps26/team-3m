apiVersion: 1

groups:
  - orgId: 1
    name: kontor-prod
    folder: Kontor
    interval: 1m
    rules:
      - uid: kontor-core-down
        title: Core service down
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: kontor-core (prod) reported no HTTP telemetry for 10 minutes — the service is down or not exporting metrics.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: absent_over_time(http_server_request_duration_seconds_count{service="kontor-core", deployment_environment="prod"}[10m])
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: kontor-ai-down
        title: AI service down
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: kontor-ai (prod) reported no runtime telemetry for 10 minutes — the service is down or not exporting metrics.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: absent_over_time({__name__=~"process(_runtime_cpython)?_cpu_time_seconds_total", service="kontor-ai", deployment_environment="prod"}[10m])
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: kontor-keycloak-down
        title: Keycloak down
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: Keycloak (prod) reported no HTTP metrics for 10 minutes — logins are likely broken.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: absent_over_time(http_server_requests_seconds_count{service="keycloak", deployment_environment="prod"}[10m])
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: kontor-error-rate
        title: High server error rate
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: More than 5% of server requests failed over the last 10 minutes in prod (see the service label for the affected service).
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 100 * (sum by (service) (rate(traces_spanmetrics_calls_total{deployment_environment="prod", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m])) or (sum by (service) (rate(traces_spanmetrics_calls_total{deployment_environment="prod", span_kind="SPAN_KIND_SERVER"}[5m])) * 0)) / clamp_min(sum by (service) (rate(traces_spanmetrics_calls_total{deployment_environment="prod", span_kind="SPAN_KIND_SERVER"}[5m])), 0.001)
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [5] }

      - uid: kontor-latency-p95
        title: High p95 latency
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: p95 server latency exceeded 2 seconds for 10 minutes in prod (see the service label for the affected service).
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: histogram_quantile(0.95, sum by (service, le) (rate(traces_spanmetrics_latency_bucket{deployment_environment="prod", span_kind="SPAN_KIND_SERVER"}[10m])))
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [2] }

      - uid: kontor-error-logs
        title: Error log spike
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: More than 30 error/exception log lines within 5 minutes in prod (see the service label for the affected service).
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: 'sum by (service) (count_over_time({deployment_environment="prod"} |~ `(?i)\b(error|exception)\b` [5m]))'
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [30] }

      - uid: kontor-jvm-heap
        title: JVM heap pressure
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: JVM heap usage stayed above 90% of its limit for 10 minutes in prod (see the service label for the affected service).
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum by (service) (jvm_memory_used_bytes{jvm_memory_type="heap", deployment_environment="prod"}) / sum by (service) (jvm_memory_limit_bytes{jvm_memory_type="heap", deployment_environment="prod"})
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0.9] }

      - uid: kontor-jvm-cpu
        title: JVM CPU saturation
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: JVM CPU utilization stayed above 90% for 15 minutes in prod (see the service label for the affected service).
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max by (service) (jvm_cpu_recent_utilization_ratio{deployment_environment="prod"})
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0.9] }

  - orgId: 1
    name: observability-stack
    folder: Kontor
    interval: 1m
    rules:
      - uid: obs-alloy-gateway-down
        title: Alloy OTLP gateway down
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: Prometheus cannot scrape the Alloy gateway — telemetry ingestion for all environments is degraded, other alerts may be blind.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: up{job="alloy"}
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: lt, params: [1] }
