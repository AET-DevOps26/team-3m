apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kontor.ai.fullname" . }}
  labels:
    {{- include "kontor.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai
spec:
  replicas: {{ .Values.ai.replicaCount }}
  selector:
    matchLabels:
      {{- include "kontor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ai
  template:
    metadata:
      labels:
        {{- include "kontor.labels" . | nindent 8 }}
        app.kubernetes.io/component: ai
      {{- if or (not .Values.ai.db.existingSecret) .Values.ai.logosApiKey }}
      annotations:
        {{- if not .Values.ai.db.existingSecret }}
        checksum/ai-postgres-secret: {{ include (print $.Template.BasePath "/ai-postgres-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.ai.logosApiKey }}
        checksum/secret: {{ include (print $.Template.BasePath "/ai-secret.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.ai.podSecurityContext | nindent 8 }}
      initContainers:
        - name: migrate
          image: {{ include "kontor.image" (dict "root" . "component" .Values.ai) | quote }}
          imagePullPolicy: {{ include "kontor.imagePullPolicy" (dict "root" . "component" .Values.ai) }}
          securityContext:
            {{- toYaml .Values.ai.containerSecurityContext | nindent 12 }}
          # ponytail: retry loop doubles as wait-for-db; the DB StatefulSet and this pod
          # are applied together, so alembic retries until Postgres is reachable.
          command:
            - /bin/sh
            - -c
            - >
              i=0;
              until alembic upgrade head; do
                i=$((i + 1));
                if [ "$i" -ge {{ .Values.ai.migrate.retries }} ]; then
                  echo "migration failed after $i attempts"; exit 1;
                fi;
                echo "database not ready, retrying ($i)"; sleep {{ .Values.ai.migrate.retryDelaySeconds }};
              done
          envFrom:
            - secretRef:
                name: {{ include "kontor.ai.postgres.secretName" . }}
          resources:
            {{- toYaml .Values.ai.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: ai
          image: {{ include "kontor.image" (dict "root" . "component" .Values.ai) | quote }}
          imagePullPolicy: {{ include "kontor.imagePullPolicy" (dict "root" . "component" .Values.ai) }}
          securityContext:
            {{- toYaml .Values.ai.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- with (include "kontor.oidc.issuerUrl" .) }}
            - name: KEYCLOAK_ISSUER
              value: {{ . | quote }}
            {{- end }}
            {{- with (include "kontor.oidc.jwkSetUri" .) }}
            - name: KEYCLOAK_JWK_SET_URI
              value: {{ . | quote }}
            {{- end }}
            - name: KEYCLOAK_AUDIENCE
              value: {{ .Values.oidc.audience | quote }}
            - name: LOCAL_EMBEDDING_MODEL
              value: {{ .Values.ai.embedding.localModel | quote }}
            {{- with .Values.ai.embedding.logosModel }}
            - name: LOGOS_EMBEDDING_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.ai.newsConsumer.enabled }}
            - name: RABBITMQ_HOST
              value: {{ include "kontor.rabbitmq.fullname" . | quote }}
            - name: RABBITMQ_PORT
              value: {{ dig "service" "amqpPort" 5672 .Values.rabbitmq | quote }}
            - name: RABBITMQ_USERNAME
              value: {{ .Values.rabbitmq.auth.username | quote }}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "kontor.rabbitmq.fullname" .) .Values.rabbitmq.auth.existingSecret }}
                  key: password
            - name: NEWS_QUEUE
              value: {{ .Values.ai.newsQueue | quote }}
            {{- end }}
            {{- range $key, $value := .Values.ai.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.observability.enabled }}
            {{- include "kontor.observability.backendEnv" (dict "root" . "serviceName" "kontor-ai") | nindent 12 }}
            - name: OTEL_PYTHON_LOG_CORRELATION
              value: "true"
            # Don't trace health probes at all (avoids orphaned ASGI child spans).
            - name: OTEL_PYTHON_EXCLUDED_URLS
              value: "health"
            {{- else }}
            # The image always launches via opentelemetry-instrument; disable the SDK
            # when no collector is wired so it stays a no-op.
            - name: OTEL_SDK_DISABLED
              value: "true"
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "kontor.ai.postgres.secretName" . }}
            {{- if or .Values.ai.logosApiKey .Values.ai.existingSecret }}
            - secretRef:
                name: {{ include "kontor.ai.secretName" . }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.ai.probes.readinessPath }}
              port: http
            initialDelaySeconds: {{ .Values.ai.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.ai.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.ai.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.ai.probes.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.ai.probes.livenessPath }}
              port: http
            initialDelaySeconds: {{ .Values.ai.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.ai.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.ai.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.ai.probes.failureThreshold }}
          resources:
            {{- toYaml .Values.ai.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.ai.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ai.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ai.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
