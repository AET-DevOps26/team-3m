{{- if .Values.postgres.enabled }}
{{- $revisionMaterial := printf "%s|%s|%s|%s|%s" .Values.news.db.database .Values.news.db.username .Values.news.db.password .Values.news.db.provisioningRevision (.Files.Get "files/postgres/init-news-db.sh") -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-news-db-%s" (include "kontor.fullname" .) (sha256sum $revisionMaterial | trunc 10) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "kontor.labels" . | nindent 4 }}
    app.kubernetes.io/component: news-db-provisioner
spec:
  backoffLimit: 8
  template:
    metadata:
      labels:
        {{- include "kontor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: news-db-provisioner
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml .Values.postgres.podSecurityContext | nindent 8 }}
      containers:
        - name: provision
          image: {{ include "kontor.image" (dict "root" . "component" .Values.postgres) | quote }}
          imagePullPolicy: {{ include "kontor.imagePullPolicy" (dict "root" . "component" .Values.postgres) }}
          command: ["/bin/sh", "/scripts/init-news-db.sh"]
          securityContext:
            {{- toYaml .Values.postgres.containerSecurityContext | nindent 12 }}
          env:
            - name: POSTGRES_HOST
              value: {{ include "kontor.postgres.fullname" . | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.service.port | quote }}
          envFrom:
            - secretRef:
                name: {{ include "kontor.postgres.secretName" . }}
            - secretRef:
                name: {{ include "kontor.news.postgres.secretName" . }}
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          secret:
            secretName: {{ include "kontor.postgres.fullname" . }}-init
            defaultMode: 0555
{{- end }}
